# CI — lint + tests for Misfire.
#
# Named exactly "CI" so the advisory `misfire.yml` workflow (which watches
# `workflows: ["CI"]` via workflow_run) has a real workflow to react to.
#
# Runs with NO API keys: the unit tests are fully offline (the model is scripted
# and the GitHub client is faked — see misfire.testkit).
name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # openai is needed to collect test_openai_loop.py (the OpenAI provider).
          pip install ruff pytest openai
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest -q
